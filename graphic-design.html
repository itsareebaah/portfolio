<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphic Designing Portfolio</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #ffe6f0;
      color: #333;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .navbar {
      background-color: #ff69b4;
    }
    .navbar-brand, .nav-link {
      color: white !important;
    }
    .portfolio-img {
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(255, 105, 180, 0.5);
      transition: transform 0.3s ease;
    }
    .portfolio-img:hover {
      transform: scale(1.05);
    }
    .section-title {
      color: #d63384;
      font-weight: bold;
    }
    .description-box {
      background-color: #fff0f5;
      border-left: 5px solid #ff69b4;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 40px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">HOME</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="#">Graphic Designing</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <div class="container mt-5">

    <!-- Description -->
    <div class="description-box">
      <h2 class="section-title">About My Graphic Design Work</h2>
      <p>I am a passionate and skilled graphic designer. I have a certificate in graphic designing and have worked on various creative projects. Below are some of the pieces from my portfolio.</p>
    </div>

    <!-- Portfolio Images -->
    <div class="row g-4">
      <div class="col-md-6 col-lg-4">
        <img src="flayer.jpg" alt="Flayer Design" class="img-fluid portfolio-img">
      </div>
      <div class="col-md-6 col-lg-4">
        <img src="visual.png" alt="Visual Design" class="img-fluid portfolio-img">
      </div>
      <div class="col-md-6 col-lg-4">
        <img src="cutwork.png" alt="cutwork" class="img-fluid portfolio-img">
      </div>
      <div class="col-md-6 col-lg-4">
        <img src="logo.png" alt="Logo Design" class="img-fluid portfolio-img">
      </div>
      <div class="col-md-6 col-lg-4">
        <img src="pentool.png" alt="Pen Tool Art" class="img-fluid portfolio-img">
      </div>
      
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
